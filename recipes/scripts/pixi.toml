# ==================================================================================================
# recipes/scripts/pixi.toml
# ==================================================================================================

[package]
name = "scripts"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }

[package.host-dependencies]
python = ">=3.14.7,<3.15"
hatchling = ">=1.32.0,<2"

[package.run-dependencies]
ffmpeg = ">=9.0.0,<9.0.1"
mutagen = ">=1.47.0,<2"
plugalyzer = { path = "../plugalyzer" }
duskverb = { path = "../duskverb" }

# ==================================================================================================
