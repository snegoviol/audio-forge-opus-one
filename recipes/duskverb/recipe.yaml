# ==================================================================================================
# recipes/duskverb/recipe.yaml
# ==================================================================================================

package:
    name: duskverb
    version: 0.7.2

# ==================================================================================================

source:
    url: https://github.com/dusk-audio/dusk-audio-plugins/releases/download/duskverb-v0.7.2/duskverb-linux.zip
    sha256: 087ca67be557a184521902d976f8e579c5f31f42b4f6be8a768d50c12cd64c86

# ==================================================================================================

build:
    number: 1
    dynamic_linking:
        # Prebuilt upstream binary — do not rewrite RPATH with patchelf.
        binary_relocation: false
    script: |
        set -euxo pipefail
        mkdir -p "${PREFIX}/lib/vst3"
        cp -a VST3/DuskVerb.vst3 "${PREFIX}/lib/vst3/"
        mkdir -p "${PREFIX}/lib/lv2"
        cp -a LV2/DuskVerb.lv2 "${PREFIX}/lib/lv2/"

# ==================================================================================================

about:
    homepage: https://github.com/dusk-audio/dusk-audio-plugins
    repository: https://github.com/dusk-audio/dusk-audio-plugins
    summary: Algorithmic reverb with eleven engines
    license: GPL-3.0-only
    description: | 
        Packaged from upstream release duskverb-v0.7.2 
        (commit eef842dcf3e1b60c12321d7ae07fc64ca4c37061).

# ==================================================================================================
