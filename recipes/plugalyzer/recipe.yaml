# ==================================================================================================
# recipes/plugalyzer/recipe.yaml
# ==================================================================================================

package:
    name: plugalyzer
    version: 0.5.0

# ==================================================================================================

source:
    url: https://github.com/CrushedPixel/Plugalyzer/releases/download/v0.5.0/Plugalyzer_Linux.zip
    sha256: 8d45bde621a424df54d341f880e22534196a4cae8a51f66ed256bff52e2d1aae

# ==================================================================================================

build:
    number: 1
    dynamic_linking:
        # Prebuilt upstream binary — do not rewrite RPATH with patchelf.
        binary_relocation: false
    script: |
        set -euxo pipefail
        mkdir -p "${PREFIX}/bin"
        install -m 755 Plugalyzer "${PREFIX}/bin/plugalyzer"

# ==================================================================================================

about:
    homepage: https://github.com/CrushedPixel/Plugalyzer
    repository: https://github.com/CrushedPixel/Plugalyzer
    summary: Command-line VST3, AU and LADSPA plugin host for easier debugging of audio plugins
    license: GPL-3.0-only
    description: | 
        Packaged from upstream release v0.5.0 
        (commit d3a49fe9e5c206db398db4b131702a8327fbb02c).

# ==================================================================================================
